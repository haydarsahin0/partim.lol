name: GitHub Pages'e dağıt

on:
  push:
    branches:
      # main henüz yok; geliştirme dalı da yayına gitsin ki Pages boş kalmasın.
      # main açıldığında ikinci satır silinebilir.
      - main
      - claude/partim-lol-game-dev-j6jwzx
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek dağıtım; sıradaki iş devam edenin bitmesini bekler.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tip denetimi
        run: npx tsc -b

      - name: Derle
        # Bu değişkenler tanımlı değilse uygulama demo modda derlenir ve
        # Supabase istemcisi pakete hiç girmez.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Yayın tanılaması
        # Hata ayıklarken en çok ihtiyaç duyulan bilgi: derlemeye NE gömüldü.
        # VITE_ değişkenleri zaten paketin içinde açıkça duruyor, gizli değil;
        # anahtarın yalnızca önekini ve uzunluğunu basıyoruz.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          {
            echo "### Yayın tanılaması"
            echo
            echo "| Ne | Değer |"
            echo "| --- | --- |"
            echo "| \`vars.VITE_SUPABASE_URL\` | \`${VITE_SUPABASE_URL:-(tanımsız)}\` |"
            if [ -n "${VITE_SUPABASE_ANON_KEY:-}" ]; then
              echo "| Anon anahtar | ${#VITE_SUPABASE_ANON_KEY} karakter, \`$(printf '%s' "$VITE_SUPABASE_ANON_KEY" | cut -c1-18)…\` |"
            else
              echo "| Anon anahtar | **tanımsız** |"
            fi
            echo
            echo "Pakete gömülen Supabase adresleri:"
            echo
            echo '```'
            grep -ohE 'https://[a-zA-Z0-9.-]+\.supabase\.(co|in)[^"'"'"'`]*' dist/assets/*.js \
              | sort -u | head -20 || echo "(hiç bulunamadı — demo modda derlenmiş)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Özel alan adını doğrula
        # Varsayılan alan adı public/CNAME dosyasından gelir (partim.lol).
        # Farklı bir alan adına geçilecekse depo değişkeni CUSTOM_DOMAIN
        # tanımlanır ve bu adım dosyanın üzerine yazar.
        run: |
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME
          fi
          echo "Yayın alan adı: $(cat dist/CNAME 2>/dev/null || echo '(yok — github.io altında)')" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Jekyll'i devre dışı bırak
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Takılı Pages deployment'larını iptal et
        # deploy-pages zaman aşımına takılıp yarım kalan bir deployment
        # bırakabilir ("Timeout reached, aborting!"). Pages aynı anda tek
        # deployment kabul ettiği için yenisi şu hatayla reddedilir:
        #   "Deployment request failed ... due to in progress deployment"
        # Kuyruktaki tamamlanmamış çalışmaları önce iptal edip sonra dağıt.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "/repos/${{ github.repository }}/pages/deployments?per_page=100" \
            --jq '.[] | select(.status != "deployed" and .status != "cancelled") | .id')
          if [ -n "$ids" ]; then
            echo "$ids" | while read -r id; do
              echo "iptal ediliyor: Pages deployment $id"
              gh api --method POST "/repos/${{ github.repository }}/pages/deployments/$id/cancel" --silent \
                || echo "iptal başarısız (büyük olasılıkla çoktan temizlendi): $id"
            done
          else
            echo "iptal edilecek Pages deployment yok"
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
