name: Supabase'e uygula

# Bilgisayar gerektirmez: bu iş akışı GitHub'ın "Run workflow" düğmesinden
# (telefon tarayıcısı dâhil) elle çalıştırılır ve Supabase CLI'yi sizin yerinize
# koşturur. Şemayı uygular, edge fonksiyonlarını yükler, Stripe anahtarlarını
# Supabase'e aktarır.
#
# Gereken ayarlar — Settings → Secrets and variables → Actions:
#   Variables: SUPABASE_PROJECT_REF   (proje adresindeki <ref> değeri)
#   Secrets:   SUPABASE_ACCESS_TOKEN  (supabase.com/dashboard/account/tokens)
#              SUPABASE_DB_PASSWORD   (proje kurulurken belirlediğiniz parola)
#   Secrets (X girişi için):        X_CONSUMER_KEY, X_CONSUMER_SECRET
#   Secrets (Faz 2, isteğe bağlı):  STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
#
# Hedefler:
#   veritabani   şemayı uygular
#   fonksiyonlar edge fonksiyonlarını ve Stripe anahtarlarını yükler
#   twitter-auth X (Twitter) girişini Yönetim API'siyle açar (panelden Save
#                sessizce başarısız olduğunda güvenilir yol budur)
#   abonelikleri-onar Stripe'ta ödenmiş ama hesaba işlenmemiş abonelikleri
#                bulup uygular. Tekrar çalıştırmak zararsız.
#   durum        hiçbir şeyi değiştirmez, yalnızca auth ayarlarını raporlar
#   oyuncu-incele  bir kullanıcıyı ve bir ildeki oy hareketini raporlar.
#                SALT OKUNUR — hiçbir kaydı değiştirmez. "şu kişi şu ile bot
#                atmış" gibi bir şüpheyi veriye bakarak doğrulamak için.
#                kullanici / il girdileriyle çalışır.
#   oy-temizle   bir hesabın oylarını siler ve sayaçları onarır. VARSAYILAN
#                KURU ÇALIŞMA: yalnızca ne silineceğini gösterir. Gerçekten
#                silmek için "uygula" kutusunu işaretleyin. GERİ ALINAMAZ.

on:
  workflow_dispatch:
    inputs:
      hedef:
        description: "Ne uygulansın?"
        type: choice
        default: hepsi
        options:
          - hepsi
          - veritabani
          - fonksiyonlar
          - twitter-auth
          - abonelikleri-onar
          - durum
          - oyuncu-incele
          - oy-temizle
      kullanici:
        description: "oyuncu-incele için kullanıcı adı (ör. oyuncu32661)"
        type: string
        required: false
      il:
        description: "il kimliği (ör. bartin). oy-temizle'de boş bırakılırsa TÜM iller."
        type: string
        default: bartin
        required: false
      uygula:
        description: "oy-temizle: gerçekten sil (işaretsizken yalnızca rapor)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Ayarları kontrol et
        # Eksik ayarı iş akışının ortasında anlaşılmaz bir CLI hatasıyla değil,
        # burada açık bir mesajla bildirelim.
        run: |
          eksik=""
          [ -z "$PROJECT_REF" ] && eksik="$eksik SUPABASE_PROJECT_REF(variable)"
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && eksik="$eksik SUPABASE_ACCESS_TOKEN(secret)"
          case "${{ inputs.hedef }}" in
            hepsi|veritabani)
              [ -z "$SUPABASE_DB_PASSWORD" ] && eksik="$eksik SUPABASE_DB_PASSWORD(secret)"
              ;;
          esac
          if [ -n "$eksik" ]; then
            echo "::error::Şu ayarlar eksik:$eksik — Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Proje: $PROJECT_REF"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: X (Twitter) girişini aç
        if: ${{ inputs.hedef == 'twitter-auth' }}
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
        run: scripts/supabase-auth.sh ac

      - name: Oyuncuyu incele
        if: ${{ inputs.hedef == 'oyuncu-incele' }}
        # Salt okunur. Çıktı iş özetine de yazılıyor ki telefondan bakılabilsin.
        run: |
          if [ -z "${{ inputs.kullanici }}" ]; then
            echo "::error::kullanici girdisi boş — incelenecek hesabın adını yazın."
            exit 1
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          scripts/oyuncu-incele.sh "${{ inputs.kullanici }}" "${{ inputs.il }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Oyları temizle
        if: ${{ inputs.hedef == 'oy-temizle' }}
        # Kuru çalışma varsayılan. Silme yalnızca "uygula" işaretliyken.
        run: |
          if [ -z "${{ inputs.kullanici }}" ]; then
            echo "::error::kullanici girdisi boş — temizlenecek hesabın adını yazın."
            exit 1
          fi
          bayrak=""
          if [ "${{ inputs.uygula }}" = "true" ]; then bayrak="--uygula"; fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          scripts/oy-temizle.sh "${{ inputs.kullanici }}" "${{ inputs.il }}" $bayrak \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Auth durumunu oku
        # Önceki adım patlasa da çalışsın: teşhis için asıl değerli çıktı bu.
        # Yalnızca oyuncu incelemesinde atlanıyor; oradaki çıktıyı boğuyor.
        if: ${{ always() && inputs.hedef != 'oyuncu-incele' && inputs.hedef != 'oy-temizle' }}
        run: |
          scripts/supabase-auth.sh oku > auth.json
          python3 scripts/auth-status.py auth.json | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f auth.json

      - name: Şemayı uygula
        if: ${{ inputs.hedef == 'hepsi' || inputs.hedef == 'veritabani' }}
        # supabase/migrations altındaki, henüz uygulanmamış dosyaları çalıştırır.
        # Tekrar çalıştırmak güvenlidir: uygulanmış migration atlanır.
        # link yalnızca burada gerekiyor; fonksiyon adımları --project-ref ile çalışır.
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Stripe anahtarlarını Supabase'e aktar
        if: ${{ inputs.hedef == 'hepsi' || inputs.hedef == 'fonksiyonlar' }}
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            supabase secrets set "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY" --project-ref "$PROJECT_REF"
            echo "STRIPE_SECRET_KEY aktarıldı."
          else
            echo "STRIPE_SECRET_KEY tanımlı değil — ödeme adımı atlanıyor (Faz 1 için normal)."
          fi
          if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then
            supabase secrets set "STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET" --project-ref "$PROJECT_REF"
            echo "STRIPE_WEBHOOK_SECRET aktarıldı."
          fi
          # Onarım işini koruyan anahtar. Tanımlı değilse veritabanı
          # parolasından türetiliyor; iş akışı dışından tahmin edilemez.
          REPAIR_KEY="${REPAIR_KEY:-$(printf '%s' "$SUPABASE_DB_PASSWORD-onarim" | sha256sum | cut -c1-48)}"
          supabase secrets set "REPAIR_KEY=$REPAIR_KEY" --project-ref "$PROJECT_REF"
          echo "REPAIR_KEY aktarıldı."

      - name: Edge fonksiyonlarını yükle
        if: ${{ inputs.hedef == 'hepsi' || inputs.hedef == 'fonksiyonlar' }}
        # Yükleme sunucu tarafında derlenir; Docker gerekmez.
        run: |
          # Buraya eklenmeyen fonksiyon yüklenmez ve istemci 404 alır —
          # "kendi partini kur" ödemeye yönlendirmiyordu, sebebi buydu.
          supabase functions deploy create-checkout --project-ref "$PROJECT_REF"
          supabase functions deploy create-party-subscription --project-ref "$PROJECT_REF"
          supabase functions deploy create-fast-votes-subscription --project-ref "$PROJECT_REF"
          supabase functions deploy confirm-checkout --project-ref "$PROJECT_REF"
          supabase functions deploy cancel-fast-votes-subscription --project-ref "$PROJECT_REF"
          # Webhook'u Stripe, onarım işini iş akışı çağırır: ikisi de kullanıcı
          # JWT'si taşımaz, kendi anahtarlarıyla doğrulanır.
          supabase functions deploy stripe-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy repair-subscriptions --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Abonelikleri onar
        # Stripe'ta ödenmiş ama hesaba işlenmemiş abonelikleri uygular.
        # "fonksiyonlar" hedefinde de çalışır: yeni yüklenen webhook'tan önce
        # kaçırılmış ödemeler aynı koşuda kurtulsun.
        if: ${{ inputs.hedef == 'abonelikleri-onar' || inputs.hedef == 'hepsi' || inputs.hedef == 'fonksiyonlar' }}
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "STRIPE_SECRET_KEY yok — onarım atlanıyor."
            exit 0
          fi
          REPAIR_KEY="${REPAIR_KEY:-$(printf '%s' "$SUPABASE_DB_PASSWORD-onarim" | sha256sum | cut -c1-48)}"
          yanit=$(curl -sS -X POST \
            "https://$PROJECT_REF.functions.supabase.co/repair-subscriptions" \
            -H "x-repair-key: $REPAIR_KEY")
          echo "$yanit"
          {
            echo "### Abonelik onarımı"
            echo ""
            echo '```json'
            echo "$yanit"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Veritabanı denetimi
        # `db push` yeşil dönse bile ne uygulandığını söylemiyor: uygulanmış bir
        # sürüm numarası sessizce atlanabiliyor (bir kez başımıza geldi, oy
        # sayısı eski hâlinde kaldı). Dağıtımdan sonra gerçek durumu okuyup
        # iş özetine yazıyoruz. Sorgu başarısız olursa iş düşmesin.
        if: ${{ inputs.hedef == 'hepsi' || inputs.hedef == 'veritabani' }}
        continue-on-error: true
        run: |
          oku() {
            scripts/supabase-query.sh "$1" 2>/dev/null || echo "[]"
          }
          {
            echo "### Veritabanı denetimi"
            echo
            echo "**Beklenen açılış tablosu** (supabase/seed-expected.json):"
            echo
            echo '```json'
            cat supabase/seed-expected.json
            echo '```'
            echo
            echo "**Veritabanında gerçekte ne var:**"
            echo
            echo '```json'
            oku "select sum(votes) as toplam_oy, count(distinct province_id) as oyu_olan_il from public.province_tallies"
            echo
            oku "select p.name, t.oy, round(100.0*t.oy/nullif((select sum(votes) from public.province_tallies),0),1) as yuzde from (select party_id, sum(votes) oy from public.province_tallies group by party_id) t join public.parties p on p.id=t.party_id order by t.oy desc limit 5"
            echo
            oku "select version from supabase_migrations.schema_migrations order by version desc limit 5"
            echo '```'
            echo
            echo "Toplam oy, beklenenden yalnızca oyuncuların gerçek oyları kadar fazla"
            echo "olmalı. Aradaki fark büyükse migration uygulanmamış demektir."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Özet
        run: |
          echo "### Supabase'e uygulandı" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Hedef: \`${{ inputs.hedef }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Proje: \`$PROJECT_REF\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Sırada: Authentication → Providers → Twitter'ı açmak ve" >> $GITHUB_STEP_SUMMARY
          echo "\`VITE_SUPABASE_URL\` / \`VITE_SUPABASE_ANON_KEY\` ile siteyi yeniden yayınlamak." >> $GITHUB_STEP_SUMMARY
